<html>
  
    <head>
    <style>
    .button {
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }

   .button1 {
  background-color: white;
  color: black;
  border: 2px solid #04AA6D;
}

.button1:hover {
  background-color: #04AA6D;
  color: white;
}

.button2 {
  background-color: white;
  color: black;
  border: 2px solid #008CBA;
}

.button2:hover {
  background-color: #008CBA;
  color: white;
}
    </style>
    </head>

    <!--Code above is from https://www.w3schools.com/tags/tag_button.asp-->

  <body>

    <label for="greeting">Choose a greeting:</label>

    <button class="button button1">Hey</button>
    <button class="button button2">What's Up</button>
    
  </body>
</html>
